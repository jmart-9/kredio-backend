spring:
  application:
    name: kredio-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/kredio_db
    username: kredio_user
    password: kredio_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

jwt:
  secret: kredio-super-secret-key-2026-minimum-256-bits-long-change-in-production
  expiration: 86400000

logging:
  level:
    com.zaxxer.hikari: DEBUG