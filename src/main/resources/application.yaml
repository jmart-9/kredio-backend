spring:
  application:
    name: kredio-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/kredio_db
    username: kredio_user
    password: kredio_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    out-of-order: true

# ✅ CORRECCIÓN: 'jwt' y 'logging' deben estar al mismo nivel que 'spring', NO indentados debajo de él.
jwt:
  secret: kredio-super-secret-key-2026-minimum-256-bits-long-change-in-production
  expiration: 86400000

logging:
  level:
    com.zaxxer.hikari: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE